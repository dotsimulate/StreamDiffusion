name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? What's the use case?
      placeholder: I'm trying to do X but currently Y is a limitation...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you've tried?

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      multiple: true
      options:
        - Inference / Pipeline
        - TensorRT optimization
        - CUDA kernels
        - ControlNet / IP-Adapter
        - TouchDesigner integration
        - Livepeer integration
        - API / Interface
        - Installation / Setup
        - Documentation
        - Other

  - type: dropdown
    id: gpu_required
    attributes:
      label: GPU Required?
      description: Does this feature require GPU-specific hardware?
      options:
        - No GPU requirement
        - Any CUDA GPU
        - Specific architecture (specify in description)
        - TensorRT capable GPU

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, mockups, or references.
